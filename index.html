<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Milan ELMILOUD | 1899 | Il Diavolo</title>
    

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- SIMPLE & CLEAN STYLING --- */
        :root {
            --milan-red: #fb090b;
            --milan-black: #050505;
            --milan-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--milan-black);
            /* Subtle stripe background to keep the Milan vibe */
            background-image: repeating-linear-gradient(90deg, #050505 0px, #050505 100px, #0a0a0a 100px, #0a0a0a 200px);
            color: var(--milan-white);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            animation: fadeIn 1.5s ease-out;
        }

        .devil-img {
            height: 80px;
            width: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(251, 9, 11, 0.5));
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        h1 span {
            color: var(--milan-red);
        }

        p.status {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        p.subtext {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 40px;
        }

        /* --- PROFESSIONAL BUTTON --- */
        .contact-btn {
            text-decoration: none;
            color: var(--milan-white);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 15px 40px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            display: inline-block;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .contact-btn:hover {
            background-color: var(--milan-red);
            border-color: var(--milan-red);
            box-shadow: 0 0 20px rgba(251, 9, 11, 0.4);
            transform: translateY(-2px);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media(max-width: 600px) {
            h1 { font-size: 3rem; }
            .devil-img { height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/600px-Logo_of_AC_Milan.svg.png" 
             alt="AC Milan" 
             class="devil-img">

        <p class="status">Under Construction</p>
        <h1>EL<span>MILOUD</span></h1>
        <p class="subtext">We are updating the website. Be back soon.</p>
        FORZA MILAN</p>

        <a href="https://www.instagram.com/im.already.cursed" class="contact-btn" target="_blank">
            Contact Me
        </a>
    </div>

</body>
</html>
